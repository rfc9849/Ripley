name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            goarch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...

      - name: Build release archive
        env:
          GOARCH: ${{ matrix.goarch }}
          ASSET: ripley-linux-${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "dist/$ASSET"
          ldflags="-s -w -X ripley/internal/toolchain.defaultGenSnapshotRepo=${GITHUB_REPOSITORY}"
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" \
            go build -trimpath -ldflags "$ldflags" -o "dist/$ASSET/ripley" ./cmd/ripley
          file "dist/$ASSET/ripley"
          "dist/$ASSET/ripley" --version
          cp LICENSE THIRD_PARTY_NOTICES "dist/$ASSET/"
          tar -C dist -czf "dist/$ASSET.tar.gz" "$ASSET"
          (cd dist && sha256sum "$ASSET.tar.gz" > "$ASSET.tar.gz.sha256")
          rm -rf "dist/$ASSET"

      - uses: actions/upload-artifact@v4
        with:
          name: ripley-linux-${{ matrix.arch }}
          path: |
            dist/ripley-linux-${{ matrix.arch }}.tar.gz
            dist/ripley-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ripley-linux-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Ripley $tag" \
              --generate-notes
          fi
          gh release upload "$tag" dist/* --clobber
